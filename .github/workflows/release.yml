name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'grinry/godot-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: |
          npm install --global npm@11
          # Prevent Changesets from creating a token-based npmrc.
          printf 'registry=https://registry.npmjs.org/\n' > "$HOME/.npmrc"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Run regression tests
        run: npm test

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: release @grinry/godot-mcp'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Request release pull request review
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: gh pr edit "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer grinry

      - name: Build desktop bundle
        if: steps.changesets.outputs.published == 'true'
        run: npm run build:mcpb

      - name: Attach desktop bundle to package release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          gh release upload "v$package_version" "dist/godot-mcp-$package_version.mcpb" --clobber
